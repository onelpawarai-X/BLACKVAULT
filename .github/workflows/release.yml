name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0). Leave empty to build artifacts only."
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The core is tested through the platform-independent harness rather than
      # `cargo test` on the runner: the full test binary links against WebView2
      # and aborts with STATUS_ENTRYPOINT_NOT_FOUND before a single test runs.
      - name: Core tests
        run: ./scripts/pure-core-test.sh

      - name: Type-check the Windows-only modules
        run: |
          rustup target add x86_64-pc-windows-msvc
          ./scripts/win-check.sh

  windows:
    name: Build Windows bundles
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks
        run: |
          npx tsc --noEmit
          npm test

      - name: Build the application, the MSI and the NSIS installer
        run: npm run tauri:build

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Include *.exe,*.msi `
            src-tauri/target/release/bundle, src-tauri/target/release/blackvault.exe |
            Where-Object { $_.FullName -notmatch '\\target\\release\\build\\' }
          foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            "$h  $($f.Name)" | Out-File -Append -Encoding ascii SHA256SUMS.txt
          }
          Get-Content SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackvault-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/blackvault.exe
            SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: BLACKVAULT ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            BLACKVAULT — YOUR VOICE. YOUR CONTROL. YOUR SECURITY.

            Native Windows desktop security system. Tauri 2 + Rust.

            **Assets**
            - `.msi` — Windows installer (MSI)
            - `-setup.exe` — Windows installer (NSIS)
            - `blackvault.exe` — portable build, runs in place
            - `SHA256SUMS.txt` — checksums

            Verify a download with `certutil -hashfile <file> SHA256`.
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/blackvault.exe
            SHA256SUMS.txt
          draft: false
          prerelease: false
